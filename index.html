<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>百首靈籤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
:root{
  --bg:#f3eee4;--paper:#fffdf8;--paper-2:#f8f3e9;--ink:#30251d;
  --muted:#817366;--red:#9d302b;--red-dark:#76221f;--gold:#ad8745;
  --gold-soft:#ddc99e;--line:#e5dac7;--shadow:0 18px 55px rgba(66,42,22,.10);
  color-scheme:light;box-sizing:border-box;
  font-family:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
}
:root[data-theme="dark"]{
  --bg:#171614;--paper:#24211d;--paper-2:#2d2822;--ink:#eee5d6;
  --muted:#b5a795;--red:#d66a5d;--red-dark:#a84940;--gold:#d5b16c;
  --gold-soft:#665638;--line:#494035;--shadow:0 18px 55px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;min-height:100vh;background:
  radial-gradient(ellipse at 50% -10%,rgba(173,135,69,.13),transparent 48%),
  var(--bg);color:var(--ink);line-height:1.8}
button,input{font:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main{width:min(100% - 32px,620px);margin:0 auto;padding:30px 0 56px}
.hero{text-align:center;padding:12px 12px 22px;position:relative}
.kicker{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:.72rem;letter-spacing:.28em;font-weight:600}
.kicker:before,.kicker:after{content:"";width:34px;height:1px;background:var(--gold-soft)}
h1{font-size:clamp(2rem,7vw,2.7rem);font-weight:900;letter-spacing:.42em;text-indent:.42em;margin:7px 0 2px;color:var(--red)}
.subtitle{color:var(--muted);font-size:.9rem;letter-spacing:.12em;margin:0}
.hero-mark{width:58px;height:58px;border:1px solid var(--gold-soft);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:var(--gold);font-size:1.6rem;position:relative}
.hero-mark:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold-soft);border-radius:50%}
nav{display:flex;justify-content:center;gap:8px;margin:0 auto 20px;padding:5px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 25px;border-radius:999px;cursor:pointer;font-size:.9rem;letter-spacing:.12em;transition:.2s}
nav button[aria-selected="true"]{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(157,48,43,.2)}
.toolbar{position:absolute;right:0;top:0}
.theme-toggle{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:50%;width:38px;height:38px;cursor:pointer}
.note{text-align:center;color:var(--muted);font-size:.84rem;margin:0 0 14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:14px;pointer-events:none;opacity:.7}
.stage{display:flex;justify-content:center;align-items:center;height:205px;position:relative;z-index:1}
#tube{width:148px;overflow:visible;transform-origin:50% 90%;filter:drop-shadow(0 9px 8px rgba(68,36,17,.13))}
#tube.shake{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.ask{display:flex;flex-direction:column;gap:12px;margin:4px auto 0;max-width:430px;position:relative;z-index:1}
.ask label{font-size:.82rem;color:var(--muted);letter-spacing:.08em}
input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink);font-size:.95rem}
input::placeholder{color:var(--muted);opacity:.75}
.go{font-weight:700;letter-spacing:.45em;text-indent:.45em;padding:13px 18px;border:1px solid var(--red);border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;cursor:pointer;box-shadow:0 7px 18px rgba(157,48,43,.18);transition:transform .2s,box-shadow .2s}
.go:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(157,48,43,.25)}
.go:disabled{opacity:.6;cursor:wait;transform:none}
.hint{text-align:center;color:var(--muted);font-size:.75rem;margin:13px 0 0;position:relative;z-index:1}
.result{margin-top:24px;display:grid;grid-template-columns:1fr;gap:18px;background:var(--paper);border:1px solid var(--gold-soft);border-radius:18px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.result:before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:12px;pointer-events:none}
.stick{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:12px 8px 18px;border-bottom:1px solid var(--gold-soft);min-height:0}
.stick .no{font-size:.83rem;color:var(--red);font-weight:900;letter-spacing:.22em}
.stick span:not(.no){font-size:1.2rem;font-weight:700;letter-spacing:.13em;line-height:1.8}
.detail{position:relative;z-index:1}
.lv{display:inline-block;font-size:1.08rem;font-weight:900;color:var(--red);margin:0 0 12px;padding:3px 13px;border:1px solid var(--gold-soft);border-radius:999px;letter-spacing:.12em}
.detail p{margin:8px 0;font-size:.91rem;line-height:1.85}
.detail b{color:var(--gold);font-weight:700;white-space:nowrap}
.detail p.jieyue{font-size:1.05rem;font-weight:700;color:var(--red);line-height:1.9;margin:10px 0 14px}
.detail p.jieyue b{color:var(--red);font-size:1.05rem}
.rec{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:13px 16px;transition:border-color .2s}
.rec[open]{border-color:var(--gold-soft)}
.rec summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.rec summary:after{content:"＋";color:var(--gold);font-size:1rem}
.rec[open] summary:after{content:"－"}
.rec summary span{font-weight:700;color:var(--ink)}
.rec small{color:var(--muted);font-size:.72rem;white-space:nowrap}
.rec p{margin:9px 0 2px;font-size:.88rem;color:var(--muted)}
.result.sealed{grid-template-columns:1fr}
.result.sealed .stick{border:0;min-height:0;padding:10px 0 6px}
.result.sealed .stick span.seal{writing-mode:horizontal-tb;max-height:none;font-size:.85rem;font-weight:400;color:var(--muted);letter-spacing:.1em}
.result.sealed .stick span.no{font-size:1.5rem;letter-spacing:.3em}
.moon{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.moon:before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:12px;pointer-events:none;opacity:.7}
.moon>*{position:relative;z-index:1}
.moon-title{margin:0;font-weight:900;color:var(--red);letter-spacing:.3em;text-indent:.3em;font-size:1.05rem}
.moon-desc{margin:4px 0 14px;color:var(--muted);font-size:.82rem}
.blocks{display:flex;justify-content:center;gap:26px;height:86px;align-items:flex-end}
.blk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.blk svg{width:78px;height:44px;overflow:visible}
.blk:nth-child(2) svg{transform:scaleX(-1)}
.blk path.body{fill:var(--red);stroke:var(--red-dark);stroke-width:2}
.blk path.hl{fill:none;stroke:rgba(255,255,255,.5);stroke-width:2.5;stroke-linecap:round}
.blk.yang path.body{fill:var(--paper-2);stroke:var(--gold)}
.blk.yang path.hl{display:none}
.blk .face{min-height:1.2em}
.blk.throw .art{animation:toss .9s ease-out}
.art{display:block;transform-origin:50% 50%}
@keyframes toss{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-62px) rotate(320deg)}100%{transform:translateY(0) rotate(720deg)}}
.verdict{margin:14px 0 4px;min-height:3.4em;font-size:.9rem;line-height:1.8}
.verdict b{display:block;font-size:1.15rem;letter-spacing:.2em;text-indent:.2em;margin-bottom:2px}
.verdict.sheng b{color:var(--gold)}
.verdict.xiao b{color:var(--muted)}
.verdict.yin b{color:var(--red)}
.moon .go{width:100%;max-width:430px}
.moon .saved{color:var(--gold);font-size:.82rem;letter-spacing:.12em;margin:4px 0 0}
.share{margin-top:16px}
.share-img{display:block;margin:14px auto 0;width:100%;max-width:500px;height:auto;border:1px solid var(--line);border-radius:8px}
.share-actions{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ghost{font:inherit;border:1px solid var(--gold-soft);background:var(--paper-2);color:var(--red);border-radius:999px;padding:8px 20px;cursor:pointer;letter-spacing:.1em}
.share-tip{margin:8px 0 0;color:var(--muted);font-size:.75rem}
.empty{text-align:center;color:var(--muted);margin:34px 0;padding:30px 12px;background:var(--paper);border:1px dashed var(--line);border-radius:14px}
.clear{font:inherit;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--red);cursor:pointer;float:right;font-size:.82rem}
#hist{padding-top:2px}
.history-heading{color:var(--muted);font-size:.82rem;letter-spacing:.12em;margin:0 0 12px}
footer{text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.08em;margin:25px 0 0}
footer span{color:var(--gold);padding:0 6px}
[hidden]{display:none!important}
@media(min-width:560px){main{padding-top:42px}.panel{padding:28px 34px}.result{grid-template-columns:190px 1fr;gap:24px;padding:28px}.stick{border-bottom:0;border-right:1px solid var(--gold-soft);padding:12px 18px 12px 0;min-height:250px;justify-content:center}.stick span:not(.no){writing-mode:vertical-rl;max-height:210px;letter-spacing:.22em}.detail p{font-size:.9rem}}
@media(max-width:390px){main{width:min(100% - 22px,620px)}.panel{padding:16px}.result{padding:18px}.rec summary{align-items:flex-start;flex-direction:column;gap:2px}.rec summary:after{position:absolute;right:28px}.toolbar{right:2px}.theme-toggle{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="hero">

  <section id="p0">

        <rect x="32" y="177" width="96" height="3" fill="var(--gold)"/>
        <text x="80" y="153" text-anchor="middle" font-size="44" font-weight="900" fill="var(--gold)" font-family="Noto Serif TC,serif">籤</text>
      </svg>
    </div>
    <div class="ask">
      <label for="q">心中所求（選填）</label>
      <input id="q" type="text" maxlength="60" placeholder="例如：學業、工作、家庭、感情……" aria-label="心中所問之事">
      <button class="go" id="go">誠心求籤</button>
    </div>
    <p class="hint" id="hint">每次結果請以理性態度參考。</p>
    </div>
    <div id="out" aria-live="polite"></div>
  </section>

  <section id="p1" hidden>
    <p class="history-heading">過往求籤紀錄・僅儲存於此裝置</p>
    <div id="hist"></div>
  </section>
  <footer>傳統文化數位呈現 <span>✦</span> 籤意供參・人生由己</footer>
</main>

    return new Blob([out],{type:"image/png"});
  }).catch(function(){ return blob; });
}

function shareBlock(f){
  var wrap = el("div","share");
  var make = el("button","go","生成分享圖片");
  wrap.appendChild(make);
  var area = el("div");
  wrap.appendChild(area);
  make.addEventListener("click", function(){
    make.disabled = true; make.textContent = "生成中…";
    var ready = (document.fonts && document.fonts.load)
      ? Promise.race([document.fonts.load('900 40px "Noto Serif TC"', "第籤解曰"), new Promise(function(r){ setTimeout(r,1500); })]).catch(function(){})
      : Promise.resolve();
    ready.then(function(){
      var cv = document.createElement("canvas");
      drawShare(f, cv);
      cv.toBlob(function(raw){ pngDpi(raw).then(function(blob){
        area.textContent = "";
        if(!blob){ area.appendChild(el("p","share-tip","此瀏覽器無法生成圖片。")); make.disabled = false; make.textContent = "重新生成"; return; }
        var url = URL.createObjectURL(blob), name = "靈籤_第" + f.id + "籤.png";
        var img = el("img","share-img"); img.src = url; img.alt = "第" + f.id + "籤 求籤結果分享圖";
        area.appendChild(img);
        var act = el("div","share-actions");
        var dl = el("a","ghost","下載圖片"); dl.href = url; dl.download = name;
        act.appendChild(dl);
        var file = null;
        try { file = new File([blob], name, {type:"image/png"}); } catch(e){}
        if(file && navigator.canShare && navigator.canShare({files:[file]})){
          var sh = el("button","ghost","分享到社群"); sh.type = "button";
          sh.addEventListener("click", function(){
            navigator.share({files:[file], title:"靈籤指引｜第" + f.id + "籤"}).catch(function(){});
          });
          act.appendChild(sh);
        }
        area.appendChild(act);
        area.appendChild(el("p","share-tip","可長按圖片儲存"));
        make.disabled = false; make.textContent = "重新生成";
      }); }, "image/png");
    });
  });
  return wrap;
}

var BLK_SVG = '<span class="art"><svg viewBox="0 0 90 50" aria-hidden="true"><path class="body" d="M6 34 C8 12 46 2 84 30 C80 42 50 48 6 34Z"/><path class="hl" d="M18 26 C32 14 52 14 68 26"/></svg></span>';
function moonPanel(f, question){
  var m = el("div","moon");
  m.appendChild(el("p","moon-title","擲筊確認"));
  m.appendChild(el("p","moon-desc","請默念所求之事，擲出聖筊，方表示此籤為神明所示，屆時將顯示籤詩與吉凶。"));
  var box = el("div","blocks"), blks = [];
  for(var i=0;i<2;i++){
    var b = el("div","blk yin"); b.innerHTML = BLK_SVG; b.appendChild(el("span","face","")); box.appendChild(b); blks.push(b);
  }
  m.appendChild(box);
  var verdict = el("p","verdict"); verdict.setAttribute("aria-live","polite");
  m.appendChild(verdict);
  var btn = el("button","go","擲筊");
  m.appendChild(btn);
  var done = false;
  btn.addEventListener("click", function(){
    if(done) return;
    var sec = new Date().getSeconds();
    btn.disabled = true; btn.textContent = "擲筊中…"; verdict.className = "verdict"; verdict.textContent = "";
    blks.forEach(function(b){ b.classList.remove("throw"); void b.getBoundingClientRect(); b.classList.add("throw"); });
    setTimeout(function(){
      var flat;
      if(sec % 3 === 0){ var a = Math.random() < 0.5; flat = [a, !a]; }
      else if(sec % 2 === 0){ flat = [true, true]; }
      else { flat = [false, false]; }
      blks.forEach(function(b,i){
        b.classList.toggle("yang", flat[i]); b.classList.toggle("yin", !flat[i]);
        b.classList.remove("throw");
        b.lastChild.textContent = flat[i] ? "陽（平面）" : "陰（凸面）";
      });
      var n = flat.filter(Boolean).length;
      verdict.textContent = "";
      var t = el("b");
      if(n === 1){
        verdict.className = "verdict sheng"; t.textContent = "聖筊";
        verdict.appendChild(t); verdict.appendChild(document.createTextNode("神明應允，此籤即為所示，請細讀籤詩與籤意。"));
        done = true; btn.hidden = true;
        var c0 = out.querySelector(".result"); if(c0) reveal(c0);
        var list = load(); list.unshift({id:f.id, t:Date.now(), q:question}); save(list); recordUse();
        m.appendChild(el("p","saved","✦ 已記錄於歷史 ✦"));
        m.appendChild(shareBlock(f));
      } else if(n === 2){
        verdict.className = "verdict xiao"; t.textContent = "笑筊（陽筊）";
        verdict.appendChild(t); verdict.appendChild(document.createTextNode("神明未明示，請再默念所問，重新擲筊。"));
        btn.disabled = false; btn.textContent = "再擲一次";
      } else {
        verdict.className = "verdict yin"; t.textContent = "哭筊（陰筊）";
        verdict.appendChild(t); verdict.appendChild(document.createTextNode("此籤非神明所示，請重新靜心求籤。"));
        done = true; btn.hidden = true;
        var card0 = out.querySelector(".result"); if(card0) card0.hidden = true;
        go.textContent = "重新求籤";
      }
    }, 950);
  });
  return m;
}

var go = document.getElementById("go"), tube = document.getElementById("tube"), out = document.getElementById("out"), q = document.getElementById("q");
go.addEventListener("click", function(){
  var lim = checkLimit();
  if(!lim.ok){ out.textContent = ""; out.appendChild(el("p","note",lim.msg)); return; }
  go.disabled = true; go.textContent = "搖籤中…"; out.textContent = "";
  tube.classList.remove("shake"); void tube.getBoundingClientRect(); tube.classList.add("shake");
  setTimeout(function(){
    var f = FORTUNES[Math.floor(Math.random()*FORTUNES.length)];

    out.appendChild(moonPanel(f, q.value.trim()));

  }, 950);
});

refreshHint();
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function renderHist(){
  var box = document.getElementById("hist"); box.textContent = "";
  var list = load();
  if(!list.length){ box.appendChild(el("p","empty","還沒有抽籤記錄。去搖一支籤吧。")); return; }
  var clr = el("button","clear","清空記錄");
  var armed = false, timer;
  clr.addEventListener("click", function(){
    if(!armed){
      armed = true; clr.textContent = "再按一次確認清空";
      timer = setTimeout(function(){ armed = false; clr.textContent = "清空記錄"; }, 4000);
      return;
    }
    clearTimeout(timer); save([]); renderHist();
  });
  box.appendChild(clr);
  box.appendChild(el("div",null)).style.clear = "both";
  list.forEach(function(r){
    var f = byId(r.id); if(!f) return;
    var d = new Date(r.t);
    var det = el("details","rec"), sum = el("summary");
    sum.appendChild(el("span",null,"第" + f.id + "籤 · " + f.lv));
    sum.appendChild(el("small",null,d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes())));
    det.appendChild(sum);
    if(r.q) det.appendChild(el("p",null,"所問：" + r.q));
    det.appendChild(el("p",null,f.poem.join("，") + "。"));
    det.appendChild(el("p",null,"解曰：" + f.all));
    box.appendChild(det);
  });
}

function show(i){
  document.getElementById("p0").hidden = i !== 0;
  document.getElementById("p1").hidden = i !== 1;
  document.getElementById("t0").setAttribute("aria-selected", i === 0);
  document.getElementById("t1").setAttribute("aria-selected", i === 1);
  if(i === 1) renderHist();
}
document.getElementById("t0").addEventListener("click", function(){ show(0); });
document.getElementById("t1").addEventListener("click", function(){ show(1); });

(function(){
  var root = document.documentElement;
  var toggle = document.getElementById("themeToggle");
  var saved = null;
  try { saved = localStorage.getItem("choucian100_theme"); } catch(e) {}
  if(saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function sync(){
    var dark = root.getAttribute("data-theme") === "dark";
    toggle.textContent = dark ? "☼" : "◐";
    toggle.setAttribute("aria-label", dark ? "切換淺色模式" : "切換深色模式");
    toggle.title = dark ? "切換淺色模式" : "切換深色模式";
  }
  toggle.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("choucian100_theme", next); } catch(e) {}
    sync();
  });
  sync();
})();
</script>
